name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Get project version
        id: ver
        run: echo "version=$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)" >> "$GITHUB_OUTPUT"

      - name: Build fat jar
        run: mvn -B -DskipTests package

      - name: Generate checksum
        run: sha256sum "target/pgp-tool-${{ steps.ver.outputs.version }}.jar" > "target/pgp-tool-${{ steps.ver.outputs.version }}.jar.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/pgp-tool-${{ steps.ver.outputs.version }}.jar
            target/pgp-tool-${{ steps.ver.outputs.version }}.jar.sha256
          generate_release_notes: true
